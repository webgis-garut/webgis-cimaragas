<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fasilitas Umum Cimaragas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/public.css">
    
    <style>
        .page-header {
            background-color: var(--primary-dark);
            color: white;
            padding: 4rem 0;
            text-align: center;
        }
        
        .page-header h1 {
            color: white;
            font-size: 2.5rem;
        }
        
        .page-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search Bar Styles */
        .search-container {
            max-width: 600px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-full);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }
        
        /* Filter Bar Styles */
        .filter-bar {
            background: var(--bg-white);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: fit-content;
            margin: 0 auto 3rem;
            position: relative;
            z-index: 10;
        }
        
        .filter-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-full);
            color: var(--text-body);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }
        
        /* Grid and Card Styles */
        .facilities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
            color: var(--text-muted);
            background: white;
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border);
        }
        
        .no-results i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
        
        .facility-card {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: transform var(--transition), box-shadow var(--transition);
            display: flex;
            flex-direction: column;
        }
        
        .facility-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }
        
        .facility-img {
            height: 160px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.5rem;
            position: relative;
        }

        /* Abstract icon background pattern inside facility-img */
        .facility-img::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
            background-size: 20px 20px;
            opacity: 0.5;
        }
        
        .img-gov { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .img-edu { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .img-rel { background: linear-gradient(135deg, #10b981, #047857); }
        .img-hlth { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .img-pub { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        
        .facility-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .facility-category {
            display: inline-block;
            padding: 0.25rem 0.8rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            align-self: flex-start;
        }
        
        .cat-gov { background: #dbeafe; color: #1d4ed8; }
        .cat-edu { background: #fef3c7; color: #d97706; }
        .cat-rel { background: #d1fae5; color: #047857; }
        .cat-hlth { background: #fee2e2; color: #b91c1c; }
        .cat-pub { background: #ede9fe; color: #6d28d9; }
        
        .facility-name {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        
        .facility-address {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            flex-grow: 1; /* Pushes external link down */
        }
        
        .facility-address i {
            margin-top: 0.2rem;
            color: var(--primary);
        }

        .facility-footer {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--bg-subtle);
        }

        .map-link {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-dark);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .map-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- Load QGIS Exported Data Variables directly -->
    <!-- These files define variables like json_Masjid_17, json_KantorDesa_19, etc. -->
    <script src="data/LapanganSepakBola_12.js"></script>
    <script src="data/Puskesmas_13.js"></script>
    <script src="data/TK_14.js"></script>
    <script src="data/SekolahDasar_15.js"></script>
    <script src="data/Madrasah_16.js"></script>
    <script src="data/Masjid_17.js"></script>
    <script src="data/Mushola_18.js"></script>
    <script src="data/KantorDesa_19.js"></script>

    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <i class="fas fa-map-marked-alt"></i>
                WebGIS Cimaragas
            </a>
            
            <button class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Beranda</a></li>
                <li><a href="map-page.html" class="nav-link">Peta Wilayah</a></li>
                <li><a href="data-stats.html" class="nav-link">Statistik</a></li>
                <li><a href="facilities.html" class="nav-link active">Fasilitas Umum</a></li>
                <li><a href="about.html" class="nav-link">Tentang Desa</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1>Direktori Fasilitas Desa</h1>
            <p>Pencarian interaktif sarana dan prasarana publik di wilayah Cimaragas.</p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="section section-light" style="flex-grow: 1;">
        <div class="container">
            
            <!-- Search & Filters (Lifted up via negative margin logic below header) -->
            <div style="margin-top: -6rem;">
                
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Cari nama fasilitas (misal: Masjid, SDN, Puskesmas...)">
                </div>

                <div class="filter-bar" id="filterBar">
                    <button class="filter-btn active" data-filter="all">Semua</button>
                    <button class="filter-btn" data-filter="Pemerintahan">Pemerintahan</button>
                    <button class="filter-btn" data-filter="Pendidikan">Pendidikan</button>
                    <button class="filter-btn" data-filter="Kesehatan">Kesehatan</button>
                    <button class="filter-btn" data-filter="Agama">Keagamaan</button>
                    <button class="filter-btn" data-filter="Umum">Umum</button>
                </div>

            </div>

            <!-- Dynamic Grid Container -->
            <div class="facilities-grid" id="facilitiesGrid">
                <!-- Cards will be populated here by JavaScript -->
            </div>
            
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top: auto;">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2024 Pemerintah Desa Cimaragas. Ditenagai oleh QGIS & Leaflet.</p>
            </div>
        </div>
    </footer>

    <script>
        // 1. Mobile Menu Logic
        document.getElementById('mobileToggle').addEventListener('click', function() {
            document.getElementById('navMenu').classList.toggle('active');
        });

        // 2. Data Consolidation Engine
        // We will read the QGIS variables loaded in the <head> and normalize them into a single array
        let allFacilities = [];

        function processGeoJSON(dataArray, category, catClass, imgClass, iconClass, label) {
            if(!dataArray || !dataArray.features) return;
            
            dataArray.features.forEach(feature => {
                const props = feature.properties;
                let gambarPath = null;
                
                // Parse QGIS image path like map.html does
                if (props['Gambar'] && props['Gambar'] !== null && String(props['Gambar']).trim() !== '') {
                    // Replace slashes/colons with underscore as per QGIS export convention
                    const safeName = String(props['Gambar']).replace(/[\\/:]/g, '_').trim();
                    gambarPath = 'images/' + safeName;
                }

                allFacilities.push({
                    name: props['Nama'] || 'Tanpa Nama',
                    address: props['Alamat'] || 'Cimaragas, Garut',
                    lat: props['Latitude'],
                    lng: props['Longitude'],
                    category: category,      // Filter string
                    catClass: catClass,      // UI Color class for text
                    imgClass: imgClass,      // UI Color class for background Image
                    iconClass: iconClass,    // FontAwesome Icon
                    label: label,             // Displayed Category Text
                    gambar: gambarPath       // Parsed Image Path
                });
            });
        }

        // Check if variables defined in QGIS export exist, then process them
        // Note: Using try/catch to gracefully handle if any layer is missing
        try { if(typeof json_KantorDesa_19 !== 'undefined') processGeoJSON(json_KantorDesa_19, 'Pemerintahan', 'cat-gov', 'img-gov', 'fa-building', 'Pemerintahan'); } catch(e){}
        try { if(typeof json_SekolahDasar_15 !== 'undefined') processGeoJSON(json_SekolahDasar_15, 'Pendidikan', 'cat-edu', 'img-edu', 'fa-school', 'Pendidikan Dasar'); } catch(e){}
        try { if(typeof json_TK_14 !== 'undefined') processGeoJSON(json_TK_14, 'Pendidikan', 'cat-edu', 'img-edu', 'fa-graduation-cap', 'Kanak-Kanak'); } catch(e){}
        try { if(typeof json_Madrasah_16 !== 'undefined') processGeoJSON(json_Madrasah_16, 'Pendidikan', 'cat-edu', 'img-edu', 'fa-book-open', 'Madrasah'); } catch(e){}
        try { if(typeof json_Puskesmas_13 !== 'undefined') processGeoJSON(json_Puskesmas_13, 'Kesehatan', 'cat-hlth', 'img-hlth', 'fa-hospital', 'Kesehatan'); } catch(e){}
        try { if(typeof json_Masjid_17 !== 'undefined') processGeoJSON(json_Masjid_17, 'Agama', 'cat-rel', 'img-rel', 'fa-mosque', 'Masjid'); } catch(e){}
        try { if(typeof json_Mushola_18 !== 'undefined') processGeoJSON(json_Mushola_18, 'Agama', 'cat-rel', 'img-rel', 'fa-place-of-worship', 'Mushola'); } catch(e){}
        try { if(typeof json_LapanganSepakBola_12 !== 'undefined') processGeoJSON(json_LapanganSepakBola_12, 'Umum', 'cat-pub', 'img-pub', 'fa-futbol', 'Fasilitas Umum'); } catch(e){}

        // Custom Sort: Group by Category logically
        allFacilities.sort((a, b) => a.name.localeCompare(b.name));

        // 3. Render Engine
        const grid = document.getElementById('facilitiesGrid');
        
        function renderCards(facilities) {
            grid.innerHTML = ''; // Clear existing
            
            if (facilities.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search-minus"></i>
                        <h3>Fasilitas Tidak Ditemukan</h3>
                        <p>Coba gunakan kata kunci pencarian yang berbeda.</p>
                    </div>
                `;
                return;
            }

            facilities.forEach(facility => {
                // Ensure valid coordinates for the Internal Map link
                const mapLink = (facility.lat && facility.lng) 
                    ? `<a href="map-page.html?lat=${facility.lat}&lng=${facility.lng}&zoom=18" class="map-link">
                        <i class="fas fa-map-marked-alt"></i> Buka di Peta WebGIS
                       </a>`
                    : '<span style="color:var(--text-muted); font-size:0.85rem;">Koordinat tidak tersedia</span>';

                // Create image block: Use real photo if available, fallback to beautiful icon block
                const imgBlock = facility.gambar
                    ? `<div class="facility-img" style="background-image: url('${facility.gambar}'); background-size: cover; background-position: center; border-bottom: 1px solid var(--border);"></div>`
                    : `<div class="facility-img ${facility.imgClass}">
                            <i class="fas ${facility.iconClass}"></i>
                       </div>`;

                const cardHTML = `
                    <div class="facility-card">
                        ${imgBlock}
                        <div class="facility-content">
                            <span class="facility-category ${facility.catClass}">${facility.label}</span>
                            <h3 class="facility-name">${facility.name}</h3>
                            <p class="facility-address">
                                <i class="fas fa-map-marker-alt"></i> ${facility.address}
                            </p>
                            <div class="facility-footer">
                                ${mapLink}
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Initial Render
        renderCards(allFacilities);

        // 4. Search and Filter Logic
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        let currentFilter = 'all';
        let currentSearch = '';

        function applyFilters() {
            let filtered = allFacilities;
            
            // Apply category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(f => f.category === currentFilter);
            }
            
            // Apply text search filter
            if (currentSearch.trim() !== '') {
                const query = currentSearch.toLowerCase();
                filtered = filtered.filter(f => 
                    f.name.toLowerCase().includes(query) || 
                    f.address.toLowerCase().includes(query)
                );
            }
            
            renderCards(filtered);
        }

        // Keyboard Typing Event
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            applyFilters();
        });

        // Click Category Event
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // UI Toggle
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                // Logic
                currentFilter = e.target.getAttribute('data-filter');
                applyFilters();
            });
        });

    </script>
</body>
</html>
