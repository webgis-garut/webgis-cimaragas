        <script>
        // Lightbox interactive logic
        function openLightbox(imgElement) {
            var lightbox = document.getElementById('imageLightbox');
            var lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = imgElement.src; 
            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            if(event.target.id === 'imageLightbox' || event.target.className === 'lightbox-close') {
                document.getElementById('imageLightbox').classList.remove('active');
            }
        }
        </script>

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         
         // Custom robust restyling: Move image row physically to the top DOM slot
         var tbody = tempDiv.querySelector('tbody') || tempDiv.querySelector('table');
         var imgTd = tempDiv.querySelector('td img');
         if (imgTd) {
             // Attach the click trigger for the fullscreen Lightbox
             imgTd.setAttribute('onclick', 'openLightbox(this)');
             
             var imgRow = imgTd.closest('tr');
             if (imgRow && tbody) {
                 tbody.prepend(imgRow);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        <script>
        document.addEventListener('DOMContentLoaded', function() {
            var layersToggle = document.querySelector('.leaflet-control-layers-toggle');
            var layersControl = document.querySelector('.leaflet-control-layers');
            
            if (layersToggle && layersControl) {
                // Change the icon to a nice fontawesome layer icon
                layersToggle.innerHTML = '<i class="fas fa-layer-group"></i>';
                
                // Add click event to toggle the expanded state manually
                layersToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    layersControl.classList.add('legend-force-open');
                });

                // Inject a title and a close button inside the legend panel
                var form = layersControl.querySelector('form.leaflet-control-layers-list');
                if(form) {
                    var title = document.createElement('h3');
                    title.className = 'legend-title';
                    title.innerText = 'Legenda Peta';
                    
                    var closeBtn = document.createElement('div');
                    closeBtn.className = 'legend-close-btn';
                    closeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    
                    closeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        layersControl.classList.remove('legend-force-open');
                    });
                    
                    form.parentElement.insertBefore(title, form);
                    form.parentElement.insertBefore(closeBtn, form);
                }

                // Close legend when clicking outside
                document.addEventListener('click', function(e) {
                    if (!layersControl.contains(e.target) && !layersToggle.contains(e.target)) {
                        layersControl.classList.remove('legend-force-open');
                    }
                });
            }
const urlParams = new URLSearchParams(window.location.search);
            const lat = urlParams.get('lat');
            const lng = urlParams.get('lng');
            const zoom = urlParams.get('zoom');
            
            if (lat && lng && typeof map !== 'undefined') {
                const targetLat = parseFloat(lat);
                const targetLng = parseFloat(lng);
setTimeout(function() {
                    map.setView([targetLat, targetLng], zoom ? parseInt(zoom) : 18);
for (var id in map._layers) {
                        var layer = map._layers[id];
                        if (layer.getLatLng && layer.openPopup) {
                            var mLatLng = layer.getLatLng();
if (Math.abs(mLatLng.lat - targetLat) < 0.00001 && Math.abs(mLatLng.lng - targetLng) < 0.00001) {
                                layer.openPopup();
                                break;
                            }
                        }
                    }
                }, 400); 
            }
        });
        </script>
